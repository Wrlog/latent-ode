name: dashboard

# Builds the results dashboard from the committed files in results/ and
# publishes it to GitHub Pages. Nothing is retrained here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - name: Install
        run: pip install -r dashboard/requirements.txt
      - name: Build the dashboard
        run: python -m dashboard.build --out site
      - name: Check the output
        run: test -f site/index.html && test -f site/app.js && test -f site/style.css && du -sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
