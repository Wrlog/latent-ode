name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Pipeline smoke test
        run: |
          python scripts/run_all.py --quick --out "$RUNNER_TEMP/quick"
          python scripts/make_figures.py --results "$RUNNER_TEMP/quick" --out "$RUNNER_TEMP/quick/figures"
